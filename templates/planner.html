{% extends "base.html" %}
{% block title %}Planner · Kopala FPL{% endblock %}
{% block content %}
<div class="space-y-8">
  <header>
    <h1 class="text-2xl font-bold text-white">Planner</h1>
    <p id="subtitle" class="text-sm text-gray-400">Loading your squad…</p>
  </header>

  <p id="error" class="hidden rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-300"></p>

  <section id="strip" class="flex flex-wrap gap-2"></section>

  <section id="metrics" class="grid grid-cols-2 gap-4 lg:grid-cols-5"></section>

  <section class="grid gap-6 xl:grid-cols-[minmax(0,1.1fr)_minmax(0,1fr)]">
    <div class="space-y-4">
      <div id="squad" class="overflow-hidden rounded-2xl border border-white/10"></div>
      <div id="transfers" class="rounded-2xl border border-white/10 bg-gray-800/60 p-4"></div>
    </div>

    <div class="rounded-2xl border border-white/10 bg-gray-800/60">
      <div id="replace-head" class="border-b border-white/10 p-4"></div>
      <div id="replace-body" class="hidden">
        <div class="flex flex-wrap gap-2 border-b border-white/10 p-4">
          <input id="q" placeholder="Search name"
                 class="w-full rounded-full border border-white/10 bg-gray-900 px-3 py-1.5 text-sm text-white placeholder:text-gray-500 focus:border-emerald-500 focus:outline-none sm:w-44">
          <select id="pos" class="rounded-full border border-white/10 bg-gray-900 px-3 py-1.5 text-sm text-white focus:outline-none">
            <option value="same">Same position</option>
            <option value="any">Any position</option>
            <option value="1">GKP</option>
            <option value="2">DEF</option>
            <option value="3">MID</option>
            <option value="4">FWD</option>
          </select>
          <input id="max" inputmode="decimal" placeholder="Max £m"
                 class="w-24 rounded-full border border-white/10 bg-gray-900 px-3 py-1.5 text-sm text-white placeholder:text-gray-500 focus:border-emerald-500 focus:outline-none">
        </div>
        <ul id="candidates" class="max-h-[520px] divide-y divide-white/5 overflow-y-auto"></ul>
      </div>
    </div>
  </section>

  <section>
    <h2 class="mb-3 text-sm font-semibold text-white">Fixtures for your planned squad</h2>
    <div id="ticker" class="overflow-x-auto rounded-2xl border border-white/10"></div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/planner.js"></script>
{% endblock %}
